[project]
name = "watchprogress"
version = "0.1.0"
description = "Watch-progress gRPC service"
requires-python = ">=3.12"
dependencies = [
    "grpcio",
    "grpcio-health-checking",
    "grpcio-reflection",
    "protobuf",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchprogress"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/watchprogress/gen"]
