[project]
name = "watch-progress-service"
version = "0.1.0"
description = "Watch-progress gRPC service"
requires-python = ">=3.12"
dependencies = [
    "grpcio",
    "grpcio-health-checking",
    "grpcio-reflection",
    "protobuf",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
]

[project.scripts]
seed-demo = "watch_progress_service.seed:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watch_progress_service", "src/gen/watchprogress"]
# Editable installs put dev-mode-dirs on sys.path, so both the server package and the
# generated `watchprogress.v1` package (src/gen) can be imported.
dev-mode-dirs = ["src", "src/gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
extend-exclude = ["src/gen"]
